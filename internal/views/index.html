<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vpod - YouTube to Podcast</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Convert YouTube channels into podcast feeds">
  <meta name="theme-color" content="#11191f">
  <link rel="manifest" href="/ui/static/manifest.json">
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="vpod">
  <link rel="apple-touch-icon" href="/ui/static/icons/icon-192.svg">
  
  <!-- Prevent phone number detection -->
  <meta name="format-detection" content="telephone=no">
  
  <link rel="stylesheet" href="/ui/static/css/pico.min.css">
  <script src="/ui/static/js/htmx@2.0.4.min.js"></script>
  <style>
    :root {
      --pico-font-size: 16px;
    }
    
    /* iOS safe area handling */
    body {
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    /* Improve touch targets for mobile */
    button, a, select, input {
      min-height: 44px;
    }
    
    /* Prevent text selection on double-tap for app-like feel */
    h1, h2, h3, label {
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    
    .add-feed-section {
      background: var(--pico-card-background-color);
      border-radius: var(--pico-border-radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid var(--pico-muted-border-color);
    }
    .add-feed-section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
    }
    .add-feed-section form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      margin-bottom: 0;
    }
    .add-feed-section input[type="text"] {
      margin-bottom: 0;
      min-width: 0;
    }
    .add-feed-section button {
      margin-bottom: 0;
      white-space: nowrap;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }
    @media (max-width: 576px) {
      .add-feed-section form {
        grid-template-columns: 1fr;
      }
      .add-feed-section button {
        width: 100%;
      }
    }
    #response-area:not(:empty) {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color);
    }
    .feed-card {
      position: relative;
    }
    .feed-card header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .feed-card header h3 {
      margin: 0;
    }
    .feed-card .feed-meta {
      color: var(--pico-muted-color);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .feed-card .feed-description {
      margin: 1rem 0;
    }
    .feed-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .overcast-btn {
      --pico-background-color: #fc7e0f;
      --pico-border-color: #fc7e0f;
      --pico-color: #fff;
    }
    .overcast-btn:hover {
      --pico-background-color: #e66d00;
      --pico-border-color: #e66d00;
    }
    .podcast-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .podcast-links details {
      margin: 0;
      display: inline-block;
    }
    .podcast-links details summary {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }
    .podcast-links details[open] summary {
      margin-bottom: 0.5rem;
    }
    .podcast-links details ul {
      position: absolute;
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: 0.5rem;
      margin: 0;
      list-style: none;
      z-index: 10;
      min-width: 150px;
    }
    .podcast-links details ul li {
      padding: 0;
    }
    .podcast-links details ul li a {
      display: block;
      padding: 0.5rem;
      text-decoration: none;
    }
    .podcast-links details ul li a:hover {
      background: var(--pico-secondary-background);
      border-radius: var(--pico-border-radius);
    }
    .delete-btn {
      --pico-background-color: transparent;
      --pico-border-color: var(--pico-del-color);
      --pico-color: var(--pico-del-color);
    }
    .delete-btn:hover {
      --pico-background-color: var(--pico-del-color);
      --pico-color: #fff;
    }
    .sort-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .sort-controls label {
      margin: 0;
      white-space: nowrap;
    }
    .sort-controls select {
      margin: 0;
      width: auto;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }
    .htmx-indicator {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--pico-muted-color);
    }
    .empty-state p {
      margin: 0;
    }
    #feeds-container {
      min-height: 100px;
    }
    .feed-card.htmx-swapping {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>vpod</h1>
      <p>Convert YouTube channels into podcast feeds</p>
    </header>

    <section class="add-feed-section">
      <h2>Add New Feed</h2>
      <form hx-post="/ui/gen"
            hx-target="#response-area"
            hx-indicator="#gen-indicator">
        <input type="text"
               name="channelURL"
               placeholder="https://www.youtube.com/@ChannelName"
               required
               autocomplete="off"
               aria-label="YouTube channel URL">
        <button type="submit">
          Add Feed
          <span id="gen-indicator" class="htmx-indicator spinner"></span>
        </button>
      </form>
      <div id="response-area"></div>
    </section>

    <section>
      <header>
        <hgroup>
          <h2>Your Feeds</h2>
          <p>Manage your podcast subscriptions</p>
        </hgroup>
      </header>

      <div class="sort-controls">
        <label for="sort">Sort by:</label>
        <select name="sort" id="sort"
                hx-get="/ui/feeds"
                hx-target="#feeds-container"
                hx-trigger="change"
                hx-indicator="#feeds-indicator">
          <option value="newest">Newest Added</option>
          <option value="oldest">Oldest Added</option>
          <option value="title_asc">Title (A-Z)</option>
          <option value="title_desc">Title (Z-A)</option>
        </select>
        <span id="feeds-indicator" class="htmx-indicator spinner"></span>
      </div>

      <div id="feeds-container"
           hx-get="/ui/feeds"
           hx-trigger="load"
           hx-indicator="#feeds-indicator">
      </div>
    </section>
  </main>

  <footer class="container">
    <small>vpod - YouTube to Podcast converter</small>
  </footer>

  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/ui/static/sw.js', { scope: '/ui/' })
        .then((registration) => {
          console.log('SW registered:', registration.scope);
        })
        .catch((error) => {
          console.log('SW registration failed:', error);
        });
    }
  </script>
</body>
</html>
