<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vpod - YouTube to Podcast</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Convert YouTube channels into podcast feeds">
  <meta name="theme-color" content="#11191f">
  <link rel="manifest" href="/ui/static/manifest.json">
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="vpod">
  <link rel="apple-touch-icon" href="/ui/static/icons/icon-192.svg">
  
  <!-- Prevent phone number detection -->
  <meta name="format-detection" content="telephone=no">
  
  <link rel="stylesheet" href="/ui/static/css/pico.min.css">
  <script src="/ui/static/js/htmx@2.0.4.min.js"></script>
  <style>
    :root {
      --pico-font-size: 16px;
    }
    
    /* iOS safe area handling */
    body {
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    /* Improve touch targets for mobile */
    button, a, select, input {
      min-height: 44px;
    }
    
    /* Prevent text selection on double-tap for app-like feel */
    h1, h2, h3, label {
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    
    .add-feed-section {
      background: var(--pico-card-background-color);
      border-radius: var(--pico-border-radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid var(--pico-muted-border-color);
    }
    .add-feed-section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
    }
    .add-feed-section form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      margin-bottom: 0;
    }
    .add-feed-section input[type="text"] {
      margin-bottom: 0;
      min-width: 0;
    }
    .add-feed-section button {
      margin-bottom: 0;
      white-space: nowrap;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }
    @media (max-width: 576px) {
      .add-feed-section form {
        grid-template-columns: 1fr;
      }
      .add-feed-section button {
        width: 100%;
      }
    }
    #response-area:not(:empty) {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color);
    }
    /* Feed rows */
    .feed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }
    .feed-row:first-child {
      border-top: 1px solid var(--pico-muted-border-color);
    }
    .feed-row-info {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
    }
    .feed-row-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }
    .feed-row-meta {
      color: var(--pico-muted-color);
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .feed-row-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .feed-subscribe-dropdown {
      margin: 0;
      display: inline-block;
      position: relative;
    }
    .feed-subscribe-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      margin: 0;
      min-height: unset;
    }
    .feed-subscribe-dropdown ul {
      position: absolute;
      right: 0;
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: 0.25rem;
      margin: 0.25rem 0 0 0;
      list-style: none;
      z-index: 10;
      min-width: 160px;
    }
    .feed-subscribe-dropdown ul li a {
      display: block;
      padding: 0.4rem 0.6rem;
      text-decoration: none;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .feed-subscribe-dropdown ul li a:hover {
      background: var(--pico-secondary-background);
      border-radius: var(--pico-border-radius);
    }
    .feed-dropdown-divider {
      border-top: 1px solid var(--pico-muted-border-color);
      margin: 0.25rem 0;
    }
    .feed-delete {
      display: inline-flex;
      align-items: center;
    }
    .feed-delete-btn {
      background: none;
      border: none;
      color: var(--pico-del-color);
      cursor: pointer;
      padding: 0.25rem 0.4rem;
      font-size: 0.9rem;
      line-height: 1;
      min-height: unset;
      border-radius: var(--pico-border-radius);
      opacity: 0.7;
    }
    .feed-delete-btn:hover {
      opacity: 1;
      background: color-mix(in srgb, var(--pico-del-color) 10%, transparent);
    }
    .feed-delete-confirm {
      display: none;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
    }
    .feed-delete.confirming .feed-delete-btn { display: none; }
    .feed-delete.confirming .feed-delete-confirm { display: inline-flex; }
    .feed-delete-prompt {
      color: var(--pico-del-color);
      font-weight: 600;
    }
    .feed-delete-yes,
    .feed-delete-no {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.4rem;
      font-size: 0.75rem;
      line-height: 1;
      min-height: unset;
      border-radius: var(--pico-border-radius);
    }
    .feed-delete-yes {
      color: var(--pico-primary-inverse);
      background: var(--pico-del-color);
      font-weight: 600;
    }
    .feed-delete-yes:hover { opacity: 0.85; }
    .feed-delete-no {
      color: var(--pico-muted-color);
    }
    .feed-delete-no:hover {
      color: var(--pico-color);
    }
    @media (max-width: 576px) {
      .feed-row {
        flex-wrap: wrap;
      }
      .feed-row-info {
        flex-direction: column;
        gap: 0.15rem;
        width: 100%;
      }
      .feed-row-title {
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
      }
    }
    .sort-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .sort-controls label {
      margin: 0;
      white-space: nowrap;
    }
    .sort-controls select {
      margin: 0;
      width: auto;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }
    .htmx-indicator {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--pico-muted-color);
    }
    .empty-state p {
      margin: 0;
    }
    #feeds-container {
      min-height: 100px;
    }
    .feed-row.htmx-swapping {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>vpod</h1>
      <p>Convert YouTube channels into podcast feeds</p>
    </header>

    <section class="add-feed-section">
      <h2>Add New Feed</h2>
      <form hx-post="/ui/gen"
            hx-target="#response-area"
            hx-indicator="#gen-indicator">
        <input type="text"
               name="channelURL"
               placeholder="https://www.youtube.com/@ChannelName"
               required
               autocomplete="off"
               aria-label="YouTube channel URL">
        <button type="submit">
          Add Feed
          <span id="gen-indicator" class="htmx-indicator spinner"></span>
        </button>
      </form>
      <div id="response-area"></div>
    </section>

    <section>
      <header>
        <hgroup>
          <h2>Your Feeds</h2>
          <p>Manage your podcast subscriptions</p>
        </hgroup>
      </header>

      <div class="sort-controls">
        <label for="sort">Sort by:</label>
        <select name="sort" id="sort"
                hx-get="/ui/feeds"
                hx-target="#feeds-container"
                hx-trigger="change"
                hx-indicator="#feeds-indicator">
          <option value="newest">Newest Added</option>
          <option value="oldest">Oldest Added</option>
          <option value="title_asc">Title (A-Z)</option>
          <option value="title_desc">Title (Z-A)</option>
        </select>
        <span id="feeds-indicator" class="htmx-indicator spinner"></span>
      </div>

      <div id="feeds-container"
           hx-get="/ui/feeds"
           hx-trigger="load"
           hx-indicator="#feeds-indicator">
      </div>
    </section>
  </main>

  <footer class="container">
    <small>vpod - YouTube to Podcast converter</small>
    <br>
    <small style="color: var(--pico-muted-color); opacity: 0.5;">{{ .Version }}</small>
  </footer>

  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/ui/static/sw.js', { scope: '/ui/' })
        .then((registration) => {
          console.log('SW registered:', registration.scope);
        })
        .catch((error) => {
          console.log('SW registration failed:', error);
        });
    }
  </script>
</body>
</html>
